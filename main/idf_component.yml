dependencies:
  idf:
    version: '>=5.3'
  # Microchip LAN8670/1/2 10BASE-T1S PHY driver. Not part of ESP-IDF itself;
  # ESP-IDF only ships 100BASE-TX PHYs (lan87xx, ksz80xx, ip101, dp83848).
  espressif/lan867x:
    version: ^2.1.0
  espressif/mqtt: '*'
  # cJSON was a built-in ESP-IDF component up to v5.x; from v6.0 it has to be
  # pulled in from the component registry.
  espressif/cjson: '*'
